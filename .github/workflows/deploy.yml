name: Campusly Production CI/CD Pipeline

on:
  push:
    branches:
      - main
      - final
      - feat/security-hardening-and-fee-management
  workflow_dispatch:

jobs:
  validate-and-deploy:
    name: Build & Zero-Downtime Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Monorepo Dependencies
        run: |
          npm install
          npm --prefix backend install
          npm --prefix frontend install

      - name: Generate Prisma Client
        run: npm --prefix backend run prisma:generate

      - name: Validate Backend & Frontend Build
        run: |
          npm --prefix backend run build
          npm --prefix frontend run build

      - name: Package Code Archive for Deployment
        run: |
          tar -czf /tmp/app.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='backend/node_modules' \
            --exclude='frontend/node_modules' \
            --exclude='backend/dist' \
            --exclude='frontend/dist' \
            .

      - name: Setup SSH Deploy Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p ${{ secrets.VPS_PORT || 22 }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Stream Archive and Unpack on VPS
        run: |
          ssh -i ~/.ssh/id_deploy -p ${{ secrets.VPS_PORT || 22 }} ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "mkdir -p /var/www/campusly.thehps.in"
          cat /tmp/app.tar.gz | ssh -i ~/.ssh/id_deploy -p ${{ secrets.VPS_PORT || 22 }} ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "tar -xzf - -C /var/www/campusly.thehps.in"

      - name: Execute Zero-Downtime Deployment on VPS
        env:
          TARGET_PORT: ${{ secrets.PORT || '5025' }}
          DB_URL: ${{ secrets.DATABASE_URL }}
          JWT_SEC: ${{ secrets.JWT_SECRET }}
          JWT_EXP: ${{ secrets.JWT_EXPIRES_IN || '7d' }}
          CORS_ORG: ${{ secrets.CORS_ORIGIN || 'https://campusly.thehps.in,http://campusly.thehps.in' }}
        run: |
          ssh -i ~/.ssh/id_deploy -p ${{ secrets.VPS_PORT || 22 }} ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "PORT='$TARGET_PORT' DATABASE_URL='$DB_URL' JWT_SECRET='$JWT_SEC' JWT_EXPIRES_IN='$JWT_EXP' CORS_ORIGIN='$CORS_ORG' bash -s" < scripts/deploy-remote.sh
